name: release

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build ARM APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Verify APK ABIs
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libflutter.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libflutter.so'

      - uses: actions/upload-artifact@v4
        with:
          name: tap-ducky-arm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
